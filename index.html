<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2724" />
    <title>Tafelkaart</title>
  </head>
  <body>
    <header class="topbar">
      <div class="title">
        <strong>Tafelkaart</strong>
        <span id="map-name" class="muted">geen kaart</span>
      </div>
      <nav class="toolbar">
        <button id="btn-load" type="button">Laden</button>
        <button id="btn-copy" type="button" class="primary">Kopieer posities</button>
        <button id="btn-turn" type="button">Nieuwe beurt</button>
        <button id="btn-undo" type="button" disabled title="Niets om ongedaan te maken">↶ Ongedaan</button>
        <span class="zoom">
          <button id="btn-zoom-out" type="button" aria-label="Uitzoomen">−</button>
          <button id="btn-zoom-in" type="button" aria-label="Inzoomen">+</button>
        </span>
        <button id="btn-theme" type="button">Thema: auto</button>
        <button id="btn-light" type="button">Licht: auto</button>
        <button id="btn-sfeer" type="button" hidden title="Welke varianten van de tegels: standaard, rijk, verlaten, …">Sfeer: standaard</button>
      </nav>
    </header>

    <section id="messages" hidden></section>

    <main id="map-scroller" class="map-scroller"></main>

    <section id="status" class="status"></section>

    <dialog id="load-dialog">
      <form method="dialog" class="load-form">
        <h2>Kaart of patch laden</h2>
        <p class="muted">Plak de JSON van de DM hieronder: een kaart (<code>"type": "map"</code>) of een patch (<code>"type": "patch"</code>). Tekst rond de JSON (zoals <code>```json</code>) mag mee.</p>
        <textarea id="map-input" rows="10" spellcheck="false" placeholder='{ "type": "map", ... }  of  { "type": "patch", ... }'></textarea>
        <div id="dialog-errors" class="dialog-errors"></div>
        <div class="dialog-buttons">
          <button id="btn-draw" type="button" class="primary">Tekenen</button>
          <label class="button">Open bestand<input id="file-input" type="file" accept=".json,application/json,text/plain" hidden /></label>
          <button id="btn-testmap" type="button">Testkaart (stal)</button>
          <button id="btn-testpatch" type="button">Testpatch (stal)</button>
          <button id="btn-testvillage" type="button">Testkaart (dorp)</button>
          <button value="close" type="submit">Sluiten</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
